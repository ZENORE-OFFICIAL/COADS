<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZENORÉ Clothing</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:black;
color:white;
}

/* HEADER */

header{
background:maroon;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:1000;
}

.logo{
font-size:32px;
font-weight:bold;
letter-spacing:3px;
}

.cart-btn{
font-size:28px;
cursor:pointer;
}

/* PRODUCTS */

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
padding:30px;
}

.product{
background:#111;
border-radius:12px;
overflow:hidden;
transition:0.3s;
cursor:pointer;
}

.product:hover{
transform:scale(1.03);
}

.product img{
width:100%;
height:320px;
object-fit:cover;
}

.product-info{
padding:15px;
}

.product-info h2{
margin-bottom:10px;
}

.price{
color:red;
font-size:20px;
font-weight:bold;
}

/* PRODUCT PAGE */

.product-page{
display:none;
padding:30px;
}

.product-page img{
width:100%;
max-width:400px;
border-radius:12px;
margin-bottom:20px;
}

.sizes{
margin:20px 0;
}

.size-btn{
padding:10px 18px;
margin-right:10px;
border:none;
background:white;
cursor:pointer;
font-weight:bold;
border-radius:6px;
}

.selected{
background:red;
color:white;
}

.add-cart{
padding:15px 25px;
background:red;
color:white;
border:none;
font-size:18px;
cursor:pointer;
border-radius:8px;
}

/* CART */

.cart{
position:fixed;
top:0;
right:-100%;
width:350px;
height:100%;
background:#111;
padding:20px;
transition:0.4s;
overflow:auto;
z-index:2000;
}

.cart.active{
right:0;
}

.cart h2{
margin-bottom:20px;
}

.cart-item{
margin-bottom:15px;
padding-bottom:10px;
border-bottom:1px solid gray;
}

.checkout-btn{
width:100%;
padding:15px;
background:red;
border:none;
color:white;
font-size:18px;
cursor:pointer;
margin-top:20px;
border-radius:8px;
}

/* CHECKOUT */

.checkout{
display:none;
padding:30px;
}

.checkout input,
.checkout textarea{
width:100%;
padding:15px;
margin-bottom:15px;
border:none;
border-radius:8px;
}

.place-order{
width:100%;
padding:15px;
background:red;
color:white;
border:none;
font-size:18px;
cursor:pointer;
border-radius:8px;
}

/* THANK YOU */

.thankyou{
display:none;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
padding:20px;
}

.thankyou h1{
font-size:50px;
margin-bottom:20px;
color:red;
}

footer{
background:#111;
padding:30px;
text-align:center;
margin-top:40px;
}

.socials a{
color:white;
text-decoration:none;
margin:10px;
border:1px solid white;
padding:10px 20px;
border-radius:8px;
display:inline-block;
}

</style>
</head>

<body>

<header>
<div class="logo">ZENORÉ</div>
<div class="cart-btn" onclick="openCart()">🛒 <span id="cart-count">0</span></div>
</header>

<!-- PRODUCTS -->

<section class="products" id="products">

<div class="product" onclick="openProduct(0)">
<img src="alone.png">
<div class="product-info">
<h2>ALONE</h2>
<p class="price">৳899</p>
</div>
</div>

<div class="product" onclick="openProduct(1)">
<img src="starboy.png">
<div class="product-info">
<h2>STARBOY</h2>
<p class="price">৳899</p>
</div>
</div>

<div class="product" onclick="openProduct(2)">
<img src="artistic.png">
<div class="product-info">
<h2>ARTISTIC</h2>
<p class="price">৳899</p>
</div>
</div>

<div class="product" onclick="openProduct(3)">
<img src="timeless.png">
<div class="product-info">
<h2>TIMELESS</h2>
<p class="price">৳899</p>
</div>
</div>

</section>

<!-- PRODUCT PAGE -->

<section class="product-page" id="product-page">
<button onclick="goHome()" style="margin-bottom:20px;padding:10px 20px;">← Back</button>

<img id="product-img">

<h1 id="product-name"></h1>

<h2 style="color:red;margin-top:10px;">৳899</h2>

<p id="product-desc" style="margin-top:20px;"></p>

<div class="sizes">
<h3>Select Size</h3>
<br>

<button class="size-btn" onclick="selectSize(this,'M')">M</button>
<button class="size-btn" onclick="selectSize(this,'L')">L</button>

</div>

<button class="add-cart" onclick="addToCart()">Add To Cart</button>

</section>

<!-- CART -->

<div class="cart" id="cart">

<h2>Your Cart</h2>

<div id="cart-items"></div>

<h3 id="total">Total: ৳0</h3>

<button class="checkout-btn" onclick="openCheckout()">Place Order</button>

</div>

<!-- CHECKOUT -->

<section class="checkout" id="checkout">

<h1 style="margin-bottom:20px;">Checkout</h1>

<form action="https://formspree.io/f/xwpobzbe" method="POST">

<input type="text" name="Name" placeholder="Your Name" required>

<input type="text" name="Phone" placeholder="Phone Number" required>

<textarea name="Address" placeholder="Your Address" required></textarea>

<input type="hidden" name="Order" id="order-data">

<button type="submit" class="place-order" onclick="showThanks()">
Confirm Order
</button>

</form>

</section>

<!-- THANK YOU -->

<section class="thankyou" id="thankyou">

<h1>Thank You ❤️</h1>

<p>Thanks for your order from ZENORÉ.</p>

<footer>

<h2 style="margin-bottom:20px;">Follow ZENORÉ</h2>

<div class="socials">

<a href="https://www.instagram.com/zenore__official/">Instagram</a>

<a href="https://www.facebook.com/profile.php?id=61589171796226">Facebook</a>

</div>

</footer>

</section>

<script>

const products = [

{
name:"ALONE",
img:"alone.png",
desc:"Premium drop shoulders. Colour: Maroon."
},

{
name:"STARBOY",
img:"starboy.png",
desc:"Premium drop shoulders. Colour: Black."
},

{
name:"ARTISTIC",
img:"artistic.png",
desc:"Premium drop shoulders. Colour: Bottle Green."
},

{
name:"TIMELESS",
img:"timeless.png",
desc:"Premium drop shoulders. Colour: White."
}

];

let selectedProduct = null;
let selectedSize = "";
let cart = [];

function openProduct(index){

selectedProduct = products[index];

document.getElementById("products").style.display="none";

document.getElementById("product-page").style.display="block";

document.getElementById("product-img").src=selectedProduct.img;

document.getElementById("product-name").innerText=selectedProduct.name;

document.getElementById("product-desc").innerText=selectedProduct.desc;

}

function goHome(){

document.getElementById("products").style.display="grid";

document.getElementById("product-page").style.display="none";

document.getElementById("checkout").style.display="none";

}

function selectSize(btn,size){

selectedSize=size;

document.querySelectorAll(".size-btn").forEach(b=>b.classList.remove("selected"));

btn.classList.add("selected");

}

function addToCart(){

if(selectedSize==""){
alert("Please select a size");
return;
}

cart.push({
name:selectedProduct.name,
size:selectedSize,
price:899
});

updateCart();

alert("Added to cart");

}

function updateCart(){

document.getElementById("cart-count").innerText=cart.length;

const cartItems=document.getElementById("cart-items");

cartItems.innerHTML="";

let total=0;

let orderText="";

cart.forEach(item=>{

total+=item.price;

cartItems.innerHTML+=`
<div class="cart-item">
<h3>${item.name}</h3>
<p>Size: ${item.size}</p>
<p>৳${item.price}</p>
</div>
`;

orderText += item.name + " | Size: " + item.size + " | ৳899\n";

});

document.getElementById("total").innerText="Total: ৳"+total;

document.getElementById("order-data").value=orderText;

}

function openCart(){

document.getElementById("cart").classList.toggle("active");

}

function openCheckout(){

document.getElementById("products").style.display="none";

document.getElementById("product-page").style.display="none";

document.getElementById("checkout").style.display="block";

}

function showThanks(){

setTimeout(()=>{

document.getElementById("checkout").style.display="none";

document.getElementById("thankyou").style.display="flex";

},1000);

}

</script>

</body>
</html>
