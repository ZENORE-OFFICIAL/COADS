<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZENORÉ Clothing</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:black;
      color:white;
    }

    header{
      background:#4b0f1a;
      padding:25px;
      text-align:center;
      font-size:40px;
      font-weight:bold;
      letter-spacing:4px;
      box-shadow:0 0 15px rgba(128,0,0,0.8);
    }

    .hero{
      text-align:center;
      padding:40px 20px;
    }

    .hero h1{
      color:#b11226;
      font-size:48px;
      margin-bottom:10px;
    }

    .hero p{
      color:#ddd;
      font-size:18px;
    }

    .products{
      display:flex;
      justify-content:center;
      gap:30px;
      flex-wrap:wrap;
      padding:50px 20px;
    }

    .card{
      width:320px;
      background:#111;
      border:2px solid maroon;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 0 15px rgba(128,0,0,0.3);
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-8px);
      box-shadow:0 0 25px rgba(178,34,34,0.8);
    }

    .card img{
      width:100%;
      height:400px;
      object-fit:cover;
    }

    .card-content{
      padding:20px;
      text-align:center;
    }

    .shirt-name{
      font-size:24px;
      margin-bottom:10px;
      font-weight:bold;
    }

    .price{
      color:#ff4d6d;
      font-size:22px;
      margin-bottom:20px;
      font-weight:bold;
    }

    button{
      background:maroon;
      color:white;
      border:none;
      padding:12px 20px;
      border-radius:8px;
      cursor:pointer;
      font-size:16px;
      transition:0.3s;
      font-weight:bold;
    }

    button:hover{
      background:white;
      color:maroon;
    }

    .cart-section{
      text-align:center;
      padding:60px 20px;
      border-top:2px solid maroon;
    }

    .cart-section h2{
      margin-bottom:20px;
      color:#ff4d6d;
      font-size:36px;
    }

    #cart-items{
      margin-bottom:20px;
      font-size:20px;
    }

    .checkout{
      margin-top:30px;
    }

    select{
      padding:12px;
      border-radius:8px;
      border:none;
      margin-bottom:20px;
      width:250px;
      font-size:16px;
    }

    .coming-soon{
      text-align:center;
      padding:70px 20px;
      color:#b11226;
      font-size:32px;
      font-weight:bold;
    }

    footer{
      background:#4b0f1a;
      padding:30px;
      text-align:center;
    }

    .socials{
      display:flex;
      justify-content:center;
      gap:20px;
      margin-top:20px;
      flex-wrap:wrap;
    }

    .socials a{
      text-decoration:none;
      color:white;
      background:maroon;
      padding:12px 25px;
      border-radius:10px;
      border:2px solid white;
      font-weight:bold;
      transition:0.3s;
    }

    .socials a:hover{
      background:white;
      color:maroon;
    }

    @media(max-width:1000px){
      .products{
        flex-direction:column;
        align-items:center;
      }
    }
  </style>
</head>

<body>

<header>
  ZENORÉ
</header>

<section class="hero">
  <h1>Premium Streetwear</h1>
  <p>Minimal • Bold • Modern</p>
</section>

<section class="products">

  <div class="card">
    <img src="focus-shirt.jpg" alt="FOCUS Shirt">

    <div class="card-content">
      <div class="shirt-name">FOCUS T-Shirt</div>
      <div class="price">৳499</div>

      <button onclick="addToCart('FOCUS T-Shirt - ৳499')">
        Add To Cart
      </button>
    </div>
  </div>

  <div class="card">
    <img src="justice-shirt.jpg" alt="JUSTICE Shirt">

    <div class="card-content">
      <div class="shirt-name">#JUSTICE T-Shirt</div>
      <div class="price">৳349</div>

      <button onclick="addToCart('#JUSTICE T-Shirt - ৳349')">
        Add To Cart
      </button>
    </div>
  </div>

  <div class="card">
    <img src="lifegoeson-shirt.jpg" alt="LIFE GOES ON Shirt">

    <div class="card-content">
      <div class="shirt-name">LIFE GOES ON T-Shirt</div>
      <div class="price">৳499</div>

      <button onclick="addToCart('LIFE GOES ON T-Shirt - ৳499')">
        Add To Cart
      </button>
    </div>
  </div>

</section>

<section class="cart-section">
  <h2>Your Cart</h2>

  <div id="cart-items">
    No items added yet.
  </div>

  <div class="checkout">

    <h3>Select Order Method</h3>

    <br>

    <select id="payment-method">
      <option>Cash On Delivery</option>
      <option>bKash</option>
      <option>Nagad</option>
      <option>Rocket</option>
    </select>

    <br>

    <button onclick="placeOrder()">
      Place Order
    </button>

  </div>
</section>

<section class="coming-soon">
  More Products Coming Soon
</section>

<footer>
  <h2>Follow ZENORÉ</h2>

  <div class="socials">

    <a href="https://www.instagram.com/zenore__official/" target="_blank">
      Instagram
    </a>

    <a href="https://www.facebook.com/profile.php?id=61589171796226" target="_blank">
      Facebook
    </a>

  </div>
</footer>

<script>
  let cart = [];

  function addToCart(item){
    cart.push(item);

    document.getElementById('cart-items').innerHTML = cart.join('<br>');
  }

  function placeOrder(){
    const method = document.getElementById('payment-method').value;

    if(cart.length === 0){
      alert('Your cart is empty!');
      return;
    }

    alert('Order placed successfully using ' + method + '!');
  }
</script>

</body>
</html>
