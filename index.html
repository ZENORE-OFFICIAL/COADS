<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZENORÉ Clothing</title>

<meta name="google-site-verification" content="ughdRJwnZYBhZX-ZGCb6A0HkGrraZXJfPtuDsrSskwY" />

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:black;
color:white;
}

/* HEADER */

header{
background:maroon;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:1000;
}

.logo{
font-size:32px;
font-weight:bold;
letter-spacing:3px;
}

.cart-btn{
font-size:28px;
cursor:pointer;
}

/* PRODUCTS */

.products{
display:flex;
flex-direction:column;
gap:25px;
padding:30px;
align-items:center;
}

.product{
background:#111;
border-radius:15px;
overflow:hidden;
width:90%;
max-width:420px;
transition:0.3s;
cursor:pointer;
border:1px solid maroon;
}

.product:hover{
transform:scale(1.02);
}

.product img{
width:100%;
height:500px;
object-fit:cover;
}

.product-info{
padding:20px;
}

.product-info h2{
margin-bottom:10px;
}

.price{
color:red;
font-size:22px;
font-weight:bold;
}

/* PRODUCT PAGE */

.product-page{
display:none;
padding:30px;
}

.back-btn{
padding:12px 20px;
margin-bottom:20px;
background:maroon;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

.product-page img{
width:100%;
max-width:420px;
border-radius:15px;
margin-bottom:20px;
}

.sizes{
margin:20px 0;
}

.size-btn{
padding:12px 20px;
margin-right:10px;
border:none;
background:white;
color:black;
cursor:pointer;
font-weight:bold;
border-radius:8px;
}

.selected{
background:red;
color:white;
}

.add-cart{
padding:15px 25px;
background:red;
color:white;
border:none;
font-size:18px;
cursor:pointer;
border-radius:10px;
margin-top:20px;
}

/* CART */

.cart{
position:fixed;
top:0;
right:-100%;
width:350px;
height:100%;
background:#111;
padding:20px;
transition:0.4s;
overflow:auto;
z-index:2000;
border-left:2px solid maroon;
}

.cart.active{
right:0;
}

.cart h2{
margin-bottom:20px;
}

.cart-item{
margin-bottom:15px;
padding-bottom:10px;
border-bottom:1px solid gray;
}

.checkout-btn{
width:100%;
padding:15px;
background:red;
border:none;
color:white;
font-size:18px;
cursor:pointer;
margin-top:20px;
border-radius:10px;
}

/* CHECKOUT */

.checkout{
display:none;
padding:30px;
}

.checkout input,
.checkout textarea{
width:100%;
padding:15px;
margin-bottom:15px;
border:none;
border-radius:10px;
background:#111;
color:white;
}

.place-order{
width:100%;
padding:15px;
background:red;
color:white;
border:none;
font-size:18px;
cursor:pointer;
border-radius:10px;
}

/* THANK YOU POPUP */

.popup{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#111;
padding:40px;
border-radius:15px;
text-align:center;
z-index:5000;
box-shadow:0 0 20px red;
border:1px solid maroon;
}

.popup h1{
color:red;
margin-bottom:15px;
}

/* FOOTER */

footer{
background:#111;
padding:40px 20px;
text-align:center;
margin-top:40px;
}

.socials a{
color:white;
text-decoration:none;
margin:10px;
padding:12px 20px;
border:1px solid white;
border-radius:10px;
display:inline-block;
background:maroon;
}

.coming{
text-align:center;
font-size:28px;
padding:60px 20px;
color:#aaa;
}

</style>

</head>

<body>

<header>

<div class="logo">
ZENORÉ
</div>

<div class="cart-btn" onclick="openCart()">
🛒 <span id="cart-count">0</span>
</div>

</header>

<!-- PRODUCTS -->

<section class="products" id="products">

<div class="product" onclick="openProduct(0)">

<img src="alone.png">

<div class="product-info">

<h2>ALONE</h2>

<p class="price">৳899</p>

</div>

</div>

<div class="product" onclick="openProduct(1)">

<img src="starboy.png">

<div class="product-info">

<h2>STARBOY</h2>

<p class="price">৳899</p>

</div>

</div>

<div class="product" onclick="openProduct(2)">

<img src="artistic.png">

<div class="product-info">

<h2>ARTISTIC</h2>

<p class="price">৳899</p>

</div>

</div>

<div class="product" onclick="openProduct(3)">

<img src="timeless.png">

<div class="product-info">

<h2>TIMELESS</h2>

<p class="price">৳899</p>

</div>

</div>

</section>

<div class="coming">
More Products Coming Soon
</div>

<!-- PRODUCT PAGE -->

<section class="product-page" id="product-page">

<button class="back-btn" onclick="goHome()">
← Back
</button>

<img id="product-img">

<h1 id="product-name"></h1>

<h2 style="color:red;margin-top:10px;">
৳899
</h2>

<p id="product-desc" style="margin-top:20px;font-size:18px;"></p>

<div class="sizes">

<h3 style="margin-bottom:15px;">
Select Size
</h3>

<button class="size-btn" onclick="selectSize(this,'M')">
M
</button>

<button class="size-btn" onclick="selectSize(this,'L')">
L
</button>

</div>

<button class="add-cart" onclick="addToCart()">
Add To Cart
</button>

</section>

<!-- CART -->

<div class="cart" id="cart">

<h2>Your Cart</h2>

<div id="cart-items"></div>

<h3 id="total">
Total: ৳0
</h3>

<button class="checkout-btn" onclick="openCheckout()">
Place Order
</button>

</div>

<!-- CHECKOUT -->

<section class="checkout" id="checkout">

<h1 style="margin-bottom:20px;">
Checkout
</h1>

<form name="orders" method="POST" data-netlify="true" onsubmit="showThanks(event)">

<input type="hidden" name="form-name" value="orders">

<input type="text" name="Name" placeholder="Your Name" required>

<input type="text" name="Phone" placeholder="Phone Number" required>

<textarea name="Address" placeholder="Your Address" required></textarea>

<input type="hidden" name="Order" id="order-data">

<button type="submit" class="place-order">
Confirm Order
</button>

</form>

</section>

<!-- THANK YOU POPUP -->

<div class="popup" id="popup">

<h1>
Thank You ❤️
</h1>

<p>
Your order has been placed successfully.
</p>

</div>

<!-- FOOTER -->

<footer>

<h2 style="margin-bottom:20px;">
Follow ZENORÉ
</h2>

<div class="socials">

<a href="https://www.instagram.com/zenore__official/" target="_blank">
Instagram
</a>

<a href="https://www.facebook.com/profile.php?id=61589171796226" target="_blank">
Facebook
</a>

</div>

</footer>

<script>

const products = [

{
name:"ALONE",
img:"alone.png",
desc:"Premium drop shoulders. Colour: Maroon."
},

{
name:"STARBOY",
img:"starboy.png",
desc:"Premium drop shoulders. Colour: Black."
},

{
name:"ARTISTIC",
img:"artistic.png",
desc:"Premium drop shoulders. Colour: Bottle Green."
},

{
name:"TIMELESS",
img:"timeless.png",
desc:"Premium drop shoulders. Colour: White."
}

];

let selectedProduct = null;

let selectedSize = "";

let cart = [];

/* OPEN PRODUCT */

function openProduct(index){

selectedProduct = products[index];

document.getElementById("products").style.display="none";

document.querySelector(".coming").style.display="none";

document.getElementById("product-page").style.display="block";

document.getElementById("product-img").src=selectedProduct.img;

document.getElementById("product-name").innerText=selectedProduct.name;

document.getElementById("product-desc").innerText=selectedProduct.desc;

}

/* BACK HOME */

function goHome(){

document.getElementById("products").style.display="flex";

document.querySelector(".coming").style.display="block";

document.getElementById("product-page").style.display="none";

document.getElementById("checkout").style.display="none";

}

/* SELECT SIZE */

function selectSize(btn,size){

selectedSize=size;

document.querySelectorAll(".size-btn").forEach(b=>b.classList.remove("selected"));

btn.classList.add("selected");

}

/* ADD TO CART */

function addToCart(){

if(selectedSize==""){

alert("Please select a size");

return;

}

cart.push({

name:selectedProduct.name,

size:selectedSize,

price:899

});

updateCart();

alert("Added to cart");

}

/* UPDATE CART */

function updateCart(){

document.getElementById("cart-count").innerText=cart.length;

const cartItems=document.getElementById("cart-items");

cartItems.innerHTML="";

let total=0;

let orderText="";

cart.forEach(item=>{

total+=item.price;

cartItems.innerHTML+=`

<div class="cart-item">

<h3>${item.name}</h3>

<p>Size: ${item.size}</p>

<p>৳${item.price}</p>

</div>

`;

orderText += item.name + " | Size: " + item.size + " | ৳899\n";

});

document.getElementById("total").innerText="Total: ৳"+total;

document.getElementById("order-data").value=orderText;

}

/* OPEN CART */

function openCart(){

document.getElementById("cart").classList.toggle("active");

}

/* OPEN CHECKOUT */

function openCheckout(){

if(cart.length===0){

alert("Your cart is empty");

return;

}

document.getElementById("products").style.display="none";

document.getElementById("product-page").style.display="none";

document.querySelector(".coming").style.display="none";

document.getElementById("checkout").style.display="block";

}

/* THANK YOU + NETLIFY FORM */

function showThanks(event){

event.preventDefault();

const form = event.target;

const formData = new FormData(form);

fetch("/",{

method:"POST",

headers:{
"Content-Type":"application/x-www-form-urlencoded"
},

body:new URLSearchParams(formData).toString()

})

.then(()=>{

document.getElementById("popup").style.display="block";

form.reset();

cart=[];

updateCart();

setTimeout(()=>{

document.getElementById("popup").style.display="none";

goHome();

},2000);

})

.catch(()=>{

alert("Order failed");

});

}

</script>

</body>
</html>
