<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ZENORÉ Clothing</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      background:black;
      color:white;
    }

    header{
      background:#4b0f1a;
      padding:25px;
      text-align:center;
      font-size:38px;
      font-weight:bold;
      letter-spacing:4px;
      color:white;
      box-shadow:0 0 15px rgba(128,0,0,0.7);
    }

    .hero{
      text-align:center;
      padding:40px 20px;
    }

    .hero h1{
      font-size:45px;
      color:#b11226;
      margin-bottom:10px;
    }

    .hero p{
      color:#d9d9d9;
      font-size:18px;
    }

    .products{
      display:flex;
      justify-content:center;
      align-items:flex-start;
      gap:30px;
      flex-wrap:wrap;
      padding:50px 20px;
    }

    .card{
      background:#111;
      border:2px solid #4b0f1a;
      border-radius:18px;
      overflow:hidden;
      width:320px;
      transition:0.4s;
      box-shadow:0 0 15px rgba(128,0,0,0.3);
    }

    .card:hover{
      transform:translateY(-8px);
      box-shadow:0 0 25px rgba(178,34,34,0.8);
    }

    .card img{
      width:100%;
      height:400px;
      object-fit:cover;
    }

    .card-content{
      padding:20px;
      text-align:center;
    }

    .shirt-name{
      font-size:24px;
      margin-bottom:10px;
      color:white;
      font-weight:bold;
    }

    .price{
      font-size:22px;
      color:#ff4d6d;
      font-weight:bold;
    }

    .coming-soon{
      text-align:center;
      padding:80px 20px;
      font-size:32px;
      color:#b11226;
      font-weight:bold;
    }

    footer{
      background:#4b0f1a;
      padding:30px;
      text-align:center;
    }

    footer h2{
      margin-bottom:20px;
      color:white;
    }

    .socials{
      display:flex;
      justify-content:center;
      gap:20px;
      flex-wrap:wrap;
    }

    .socials a{
      text-decoration:none;
      color:white;
      background:maroon;
      padding:12px 28px;
      border-radius:10px;
      font-weight:bold;
      transition:0.3s;
      border:2px solid white;
    }

    .socials a:hover{
      background:white;
      color:maroon;
    }

    @media(max-width:1000px){
      .products{
        flex-direction:column;
        align-items:center;
      }
    }
  </style>
</head>

<body>

  <header>
    ZENORÉ
  </header>

  <section class="hero">
    <h1>Premium Streetwear</h1>
    <p>Minimal • Bold • Modern</p>
  </section>

  <section class="products">

    <div class="card">
      <img src="focus-shirt.jpg" alt="FOCUS Shirt">

      <div class="card-content">
        <div class="shirt-name">FOCUS T-Shirt</div>
        <div class="price">৳499</div>
      </div>
    </div>

    <div class="card">
      <img src="justice-shirt.jpg" alt="#JUSTICE Shirt">

      <div class="card-content">
        <div class="shirt-name">#JUSTICE T-Shirt</div>
        <div class="price">৳349</div>
      </div>
    </div>

    <div class="card">
      <img src="lifegoeson-shirt.jpg" alt="LIFE GOES ON Shirt">

      <div class="card-content">
        <div class="shirt-name">LIFE GOES ON T-Shirt</div>
        <div class="price">৳499</div>
      </div>
    </div>

  </section>

  <section class="coming-soon">
    More Products Coming Soon
  </section>

  <footer>
    <h2>Follow ZENORÉ</h2>

    <div class="socials">

      <a href="https://www.instagram.com/zenore__official?igsh=MWdlaXBzb3BiaWgwcw==&utm_source=ig_contact_invite" target="_blank">
        Instagram
      </a>

      <a href="https://www.facebook.com/profile.php?id=61589171796226&mibextid=ZbWKwL" target="_blank">
        Facebook
      </a>

    </div>
  </footer>

</body>
</html>
