<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZENORÉ</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:black;
color:white;
}

header{
background:maroon;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:1000;
}

.logo{
font-size:28px;
font-weight:bold;
}

.cart{
font-size:28px;
cursor:pointer;
}

.products{
display:flex;
flex-direction:column;
align-items:center;
gap:20px;
padding:20px;
}

.product{
background:#111;
width:90%;
max-width:400px;
border-radius:15px;
overflow:hidden;
border:1px solid maroon;
}

.product img{
width:100%;
height:450px;
object-fit:cover;
}

.product h2{
padding:10px;
}

.price{
padding:0 10px 10px;
color:red;
font-weight:bold;
}

.stock{
padding:0 10px 15px;
color:#aaa;
}

.page{
display:none;
padding:20px;
}

.page img{
width:100%;
max-width:400px;
border-radius:15px;
}

.btn{
padding:10px 15px;
margin:5px;
background:white;
color:black;
border:none;
cursor:pointer;
}

.selected{
background:red;
color:white;
}

.add{
margin-top:15px;
padding:12px;
background:red;
color:white;
border:none;
width:100%;
border-radius:10px;
}

.cartBox{
position:fixed;
right:-100%;
top:0;
width:320px;
height:100%;
background:#111;
padding:20px;
transition:0.3s;
overflow:auto;
z-index:2000;
}

.cartBox.active{
right:0;
}

.checkoutBtn{
width:100%;
padding:12px;
background:red;
border:none;
color:white;
margin-top:15px;
}

.checkout{
display:none;
padding:20px;
}

input,textarea{
width:100%;
padding:12px;
margin:10px 0;
background:#111;
border:none;
color:white;
}

.orderBtn{
width:100%;
padding:12px;
background:red;
border:none;
color:white;
}

.popup{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#111;
padding:30px;
border:1px solid maroon;
text-align:center;
z-index:5000;
}

.popup h1{
color:red;
}

.dashboard{
padding:20px;
background:#111;
margin:20px;
border-radius:15px;
}

.whatsapp{
display:block;
background:green;
color:white;
text-align:center;
padding:15px;
margin-top:15px;
text-decoration:none;
border-radius:10px;
}

.couponBox{
margin-top:15px;
}

footer{
background:#111;
padding:40px 20px;
text-align:center;
margin-top:40px;
}

.socials a{
text-decoration:none;
color:white;
background:maroon;
padding:12px 20px;
border-radius:10px;
margin:10px;
display:inline-block;
}

</style>
</head>
<body>

<header>
<div class="logo">ZENORÉ</div>
<div class="cart" onclick="toggleCart()">🛒 <span id="count">0</span></div>
</header>

<div class="products" id="products">

<div class="product" onclick="openP(0)">
<img src="alone.png">
<h2>ALONE</h2>
<p class="price">৳899</p>
<p class="stock">Stock: 2</p>
</div>

<div class="product" onclick="openP(1)">
<img src="starboy.png">
<h2>STARBOY</h2>
<p class="price">৳899</p>
<p class="stock">Stock: 2</p>
</div>

<div class="product" onclick="openP(2)">
<img src="artistic.png">
<h2>ARTISTIC</h2>
<p class="price">৳899</p>
<p class="stock">Stock: 2</p>
</div>

<div class="product" onclick="openP(3)">
<img src="timeless.png">
<h2>TIMELESS</h2>
<p class="price">৳899</p>
<p class="stock">Stock: 2</p>
</div>

</div>

<div class="page" id="page">

<img id="img">

<h2 id="name"></h2>

<p style="color:red;">৳899</p>

<p>Premium Drop Shoulder Shirt</p>

<h3>Select Size</h3>

<button class="btn" onclick="size('M',this)">M</button>
<button class="btn" onclick="size('L',this)">L</button>

<button class="add" onclick="add()">Add To Cart</button>

<a class="whatsapp" id="waBtn" target="_blank">
Order On WhatsApp
</a>

</div>

<div class="cartBox" id="cartBox">

<h2>Cart</h2>

<div id="items"></div>

<div class="couponBox">
<input type="text" id="coupon" placeholder="Coupon Code">
<button class="checkoutBtn" onclick="applyCoupon()">Apply Coupon</button>
</div>

<h3>Total: ৳<span id="total">0</span></h3>

<button class="checkoutBtn" onclick="checkout()">Place Order</button>

</div>

<div class="checkout" id="checkout">

<h2>Checkout</h2>

<form name="orders" method="POST" data-netlify="true" onsubmit="return submitForm()">

<input type="hidden" name="form-name" value="orders">

<input type="text" name="Name" placeholder="Name" required>

<input type="text" name="Phone" placeholder="Phone" required>

<textarea name="Address" placeholder="Address" required></textarea>

<input type="hidden" name="Order" id="order">

<button class="orderBtn" type="submit">Confirm Order</button>

</form>

</div>

<div class="popup" id="popup">
<h1>Thank You ❤️</h1>
<p>Your order has been placed</p>
</div>

<footer>
<h2>Follow ZENORÉ</h2>
<div class="socials">
<a href="https://www.instagram.com/zenore__official/" target="_blank">Instagram</a>
<a href="https://www.facebook.com/profile.php?id=61589171796226" target="_blank">Facebook</a>
</div>
</footer>

<script>

let products = [
{name:"ALONE",i:"alone.png"},
{name:"STARBOY",i:"starboy.png"},
{name:"ARTISTIC",i:"artistic.png"},
{name:"TIMELESS",i:"timeless.png"}
];

let current;
let cart = [];
let selectedSize = "";
let discount = 0;

function openP(x){

current = products[x];

document.getElementById("products").style.display="none";
document.getElementById("page").style.display="block";

document.getElementById("img").src=current.i;
document.getElementById("name").innerText=current.n;

document.getElementById("waBtn").href =
"https://wa.me/8801611111523?text=I want to order " + current.n;

}

function size(s,b){
selectedSize=s;
document.querySelectorAll(".btn").forEach(x=>x.classList.remove("selected"));
b.classList.add("selected");
}

function add(){

if(!selectedSize){
alert("Select size");
return;
}

cart.push({name:current.n,size:selectedSize,price:899});

updateCart();

alert("Added To Cart");

}

function updateCart(){

let total=0;
let text="";

document.getElementById("items").innerHTML="";

cart.forEach(i=>{

total += i.price;

text += `${i.name} | ${i.size} | 899\n`;

document.getElementById("items").innerHTML += `
<p>${i.name} (${i.size}) - ৳899</p>
`;

});

if(discount>0){
total -= discount;
}

document.getElementById("count").innerText=cart.length;
document.getElementById("total").innerText=total;
document.getElementById("order").value=text;

}

function applyCoupon(){

let code = document.getElementById("coupon").value;

if(code==="newatzenore07"){
discount = 0;
alert("Coupon Applied");
updateCart();
}else{
alert("Invalid Coupon");
}

}

function toggleCart(){
document.getElementById("cartBox").classList.toggle("active");
}

function checkout(){
document.getElementById("checkout").style.display="block";
document.getElementById("page").style.display="none";
}

function submitForm(){

document.getElementById("checkout").style.display = "none";

document.getElementById("popup").style.display = "block";

setTimeout(()=>{
document.forms[0].submit();
},1200);

return false;

}

</script>

</body>
</html>
