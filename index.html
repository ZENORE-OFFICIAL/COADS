<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZENORÉ</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:black;
color:white;
}

/* HEADER */

header{
background:maroon;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:1000;
}

.logo{
font-size:35px;
font-weight:bold;
letter-spacing:3px;
}

.cart-icon{
font-size:30px;
cursor:pointer;
position:relative;
}

#cart-count{
position:absolute;
top:-10px;
right:-10px;
background:red;
width:22px;
height:22px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:12px;
}

/* HERO */

.hero{
text-align:center;
padding:50px 20px;
}

.hero h1{
font-size:50px;
color:#ff4d6d;
}

.hero p{
margin-top:10px;
color:#ddd;
}

/* PRODUCTS */

.products{
display:flex;
justify-content:center;
gap:30px;
flex-wrap:wrap;
padding:40px 20px;
}

.card{
background:#111;
border:2px solid maroon;
width:320px;
border-radius:20px;
overflow:hidden;
transition:0.4s;
}

.card:hover{
transform:translateY(-10px);
box-shadow:0 0 20px maroon;
}

.card img{
width:100%;
height:400px;
object-fit:cover;
}

.card-content{
padding:20px;
text-align:center;
}

.price{
color:#ff4d6d;
font-size:24px;
margin:15px 0;
font-weight:bold;
}

button{
background:maroon;
color:white;
border:none;
padding:12px 20px;
border-radius:10px;
cursor:pointer;
font-size:16px;
font-weight:bold;
transition:0.3s;
}

button:hover{
background:white;
color:maroon;
}

/* CART */

.cart-panel{
position:fixed;
top:0;
right:-100%;
width:350px;
height:100%;
background:#111;
border-left:3px solid maroon;
padding:20px;
transition:0.5s;
z-index:2000;
overflow-y:auto;
}

.cart-panel.active{
right:0;
}

.cart-panel h2{
margin-bottom:20px;
color:#ff4d6d;
}

.cart-item{
margin-bottom:15px;
padding-bottom:10px;
border-bottom:1px solid gray;
}

.total{
margin:20px 0;
font-size:22px;
color:#ff4d6d;
font-weight:bold;
}

.close-btn{
background:red;
margin-bottom:20px;
}

/* CHECKOUT */

.checkout{
display:none;
padding:50px 20px;
max-width:500px;
margin:auto;
}

.checkout h2{
text-align:center;
margin-bottom:30px;
color:#ff4d6d;
}

form{
display:flex;
flex-direction:column;
gap:20px;
}

input, select{
padding:15px;
border:none;
border-radius:10px;
font-size:16px;
}

/* THANK YOU */

.thankyou{
display:none;
text-align:center;
padding:100px 20px;
}

.thankyou h1{
font-size:50px;
color:#ff4d6d;
}

.thankyou p{
margin-top:20px;
font-size:20px;
}

/* COMING */

.coming{
text-align:center;
padding:80px 20px;
font-size:35px;
color:#ff4d6d;
font-weight:bold;
}

/* FOOTER */

footer{
background:maroon;
padding:30px;
text-align:center;
}

.socials{
margin-top:20px;
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
}

.socials a{
text-decoration:none;
color:white;
background:#5a0011;
padding:12px 25px;
border-radius:10px;
border:2px solid white;
transition:0.3s;
}

.socials a:hover{
background:white;
color:maroon;
}

/* MOBILE */

@media(max-width:768px){

.products{
flex-direction:column;
align-items:center;
}

.cart-panel{
width:100%;
}

}

</style>
</head>

<body>

<!-- HEADER -->

<header>

<div class="logo">
ZENORÉ
</div>

<div class="cart-icon" onclick="openCart()">
🛒
<div id="cart-count">0</div>
</div>

</header>

<!-- HERO -->

<section class="hero">

<h1>Premium Streetwear</h1>

<p>Minimal • Bold • Modern</p>

</section>

<!-- PRODUCTS -->

<section class="products">

<div class="card">

<img src="focus-shirt.jpg">

<div class="card-content">

<h2>FOCUS T-Shirt</h2>

<div class="price">৳499</div>

<button onclick="addToCart('FOCUS T-Shirt',499)">
Add To Cart
</button>

</div>

</div>

<div class="card">

<img src="justice-shirt.jpg">

<div class="card-content">

<h2>#JUSTICE T-Shirt</h2>

<div class="price">৳349</div>

<button onclick="addToCart('#JUSTICE T-Shirt',349)">
Add To Cart
</button>

</div>

</div>

<div class="card">

<img src="lifegoeson-shirt.jpg">

<div class="card-content">

<h2>LIFE GOES ON T-Shirt</h2>

<div class="price">৳499</div>

<button onclick="addToCart('LIFE GOES ON T-Shirt',499)">
Add To Cart
</button>

</div>

</div>

</section>

<!-- CART -->

<div class="cart-panel" id="cartPanel">

<button class="close-btn" onclick="closeCart()">
Close
</button>

<h2>Your Cart</h2>

<div id="cart-items">
No items added.
</div>

<div class="total">
Total: ৳<span id="total">0</span>
</div>

<button onclick="goCheckout()">
Place Order
</button>

</div>

<!-- CHECKOUT -->

<section class="checkout" id="checkout">

<h2>Order Details</h2>

<form name="orders" method="POST" data-netlify="true" onsubmit="showThankYou()">

<input type="hidden" name="form-name" value="orders">

<input type="text" name="name" placeholder="Your Name" required>

<input type="text" name="address" placeholder="Address" required>

<input type="tel" name="phone" placeholder="Phone Number" required>

<select name="payment" required>

<option value="">Select Payment Method</option>

<option>bKash</option>

<option>Nagad</option>

<option>Rocket</option>

<option>Cash On Delivery</option>

</select>

<button type="submit">
Confirm Order
</button>

</form>

</section>

<!-- THANK YOU -->

<section class="thankyou" id="thankyou">

<h1>Thank You ❤️</h1>

<p>
Thanks for your order from ZENORÉ.
</p>

</section>

<!-- COMING -->

<section class="coming">

More Products Coming Soon

</section>

<!-- FOOTER -->

<footer>

<h2>Follow ZENORÉ</h2>

<div class="socials">

<a href="https://www.instagram.com/zenore__official/" target="_blank">
Instagram
</a>

<a href="https://www.facebook.com/profile.php?id=61589171796226" target="_blank">
Facebook
</a>

</div>

</footer>

<!-- SCRIPT -->

<script>

let cart = [];
let total = 0;

function addToCart(name,price){

cart.push({name,price});

total += price;

updateCart();

}

function updateCart(){

const cartItems = document.getElementById('cart-items');

const totalElement = document.getElementById('total');

const cartCount = document.getElementById('cart-count');

cartCount.innerText = cart.length;

if(cart.length===0){

cartItems.innerHTML = "No items added.";

}

else{

cartItems.innerHTML = "";

cart.forEach(item=>{

cartItems.innerHTML += `
<div class="cart-item">
${item.name} - ৳${item.price}
</div>
`;

});

}

totalElement.innerText = total;

}

function openCart(){

document.getElementById('cartPanel').classList.add('active');

}

function closeCart(){

document.getElementById('cartPanel').classList.remove('active');

}

function goCheckout(){

if(cart.length===0){

alert("Your cart is empty!");

return;

}

document.querySelector('.products').style.display='none';

document.querySelector('.hero').style.display='none';

document.querySelector('.coming').style.display='none';

document.getElementById('cartPanel').style.display='none';

document.getElementById('checkout').style.display='block';

window.scrollTo(0,0);

}

function showThankYou(){

setTimeout(()=>{

document.getElementById('checkout').style.display='none';

document.getElementById('thankyou').style.display='block';

window.scrollTo(0,0);

},500);

}

</script>

</body>
</html>
